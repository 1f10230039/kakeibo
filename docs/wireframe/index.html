<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家計簿 ワイヤーフレーム</title>
<style>
  :root { --bg:#f4f4f2; --frame:#ffffff; --line:#c9c9c4; --box:#e3e3df; --box2:#d2d2cd; --ink:#55554f; --ink2:#8a8a84; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; font-size:12px; }
  header.page { padding:24px 16px 8px; max-width:1400px; margin:0 auto; }
  header.page h1 { font-size:20px; margin:0 0 4px; font-weight:600; }
  header.page p { margin:0; color:var(--ink2); line-height:1.7; }
  .grid { display:flex; flex-wrap:wrap; gap:32px 24px; padding:16px; max-width:1400px; margin:0 auto; }
  figure { margin:0; }
  figcaption { font-size:13px; font-weight:600; margin-bottom:8px; }
  figcaption span { font-weight:400; color:var(--ink2); margin-left:6px; }
  .phone { width:300px; min-height:650px; background:var(--frame); border:1px solid var(--line); border-radius:32px; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .scroll { flex:1; overflow:hidden; padding:0 0 8px; display:flex; flex-direction:column; gap:10px; }
  .scroll > * { flex-shrink:0; }
  .hscroll { padding-bottom:2px; }
  .pad { padding:0 16px; }
  .box { background:var(--box); border-radius:14px; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--ink); padding:6px; line-height:1.4; }
  .box.dark { background:var(--box2); }
  .box.line { background:transparent; border:1px dashed var(--line); }
  .photo { background:repeating-linear-gradient(135deg,#dcdcd7 0 10px,#e6e6e2 10px 20px); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .h { height:var(--h); }
  .label { font-size:11px; color:var(--ink2); padding:0 16px; }
  .big { font-size:22px; font-weight:700; letter-spacing:.02em; }
  .tabbar { height:64px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-around; padding:0 8px; background:#fff; }
  .tab { width:44px; text-align:center; font-size:10px; color:var(--ink2); }
  .tab i { display:block; width:22px; height:22px; margin:0 auto 3px; border-radius:6px; background:var(--box2); }
  .tab.on { color:var(--ink); font-weight:700; }
  .tab.on i { background:#9a9a94; }
  .plus { width:50px; height:50px; border-radius:50%; background:#9a9a94; color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center; margin-top:-22px; }
  .hscroll { display:flex; gap:8px; overflow:hidden; padding-left:16px; }
  .hscroll .box { flex:0 0 110px; height:120px; flex-direction:column; }
  .chip { display:inline-block; padding:3px 10px; border-radius:20px; background:var(--box); margin-right:4px; }
  .chip.on { background:var(--box2); font-weight:700; }
  .list .item { display:flex; align-items:center; gap:10px; padding:8px 16px; border-bottom:1px solid #eeeeea; }
  .list .dot { width:28px; height:28px; border-radius:9px; background:var(--box); flex:0 0 28px; }
  .list .t { flex:1; } .list .t small { display:block; color:var(--ink2); font-size:10px; }
  .dim { position:absolute; inset:0; background:rgba(60,60,55,.35); }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:22px 22px 0 0; padding:14px 16px 20px; display:flex; flex-direction:column; gap:10px; }
  .grab { width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 4px; }
  .dots { text-align:center; } .dots b { display:inline-block; width:6px; height:6px; border-radius:3px; background:var(--line); margin:0 2px; } .dots b.on { width:14px; background:#9a9a94; }
  .topbar { height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
  .ico { width:22px; height:22px; border-radius:6px; background:var(--box2); }
  .pc { width:980px; max-width:calc(100vw - 32px); height:600px; background:#fff; border:1px solid var(--line); border-radius:12px; display:flex; overflow:hidden; }
  .side { width:170px; border-right:1px solid var(--line); padding:20px 12px; display:flex; flex-direction:column; gap:10px; }
  .side .tab { width:auto; text-align:left; display:flex; align-items:center; gap:8px; font-size:12px; }
  .side .tab i { margin:0; }
  .pcmain { flex:1; display:flex; gap:20px; padding:20px; }
  .pcmain > div { flex:1; display:flex; flex-direction:column; gap:12px; }
  .note { font-size:10px; color:var(--ink2); }
  svg text { font-family:inherit; }
  .flow { width:100%; max-width:1100px; background:#fff; border:1px solid var(--line); border-radius:12px; }
</style>
</head>
